<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Fominha</title>
    <meta name="description" content="Entre na sua conta Fominha para pedir comida.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23D3261C'/%3E%3Cpath d='M12 10v7a4 4 0 0 0 8 0v-7M16 10v20M27 10c-2.5 2-3.5 5-3.5 9H27v11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="src/js/script.js" defer></script>
</head>
<body>
    <div class="pagina">

        <!-- Lado esquerdo: marca e ilustração -->
        <aside class="vitrine">
            <div class="logo">
                <svg class="logo-marca" viewBox="0 0 40 40" aria-hidden="true">
                    <circle cx="20" cy="20" r="20" fill="#fff"/>
                    <path d="M12 10v7a4 4 0 0 0 8 0v-7M16 10v20M27 10c-2.5 2-3.5 5-3.5 9H27v11" fill="none" stroke="#D3261C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Fominha</span>
            </div>

            <p class="vitrine-titulo">Bateu a fome?<br>A gente leva.</p>
            <p class="vitrine-texto">Peça dos restaurantes do seu bairro e receba na porta de casa.</p>

            <svg class="vitrine-ilustracao" viewBox="0 0 640 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                <circle cx="320" cy="300" r="270" fill="#B31E15"/>

                <!-- Fatia de pizza -->
                <g transform="translate(14 0) rotate(-14 110 220)">
                    <path d="M30 120 Q110 86 190 120 L120 340 Z" fill="#FFD76A"/>
                    <path d="M30 120 Q110 86 190 120" fill="none" stroke="#E89A2E" stroke-width="20" stroke-linecap="round"/>
                    <circle cx="82" cy="152" r="17" fill="#C4321F"/>
                    <circle cx="140" cy="158" r="15" fill="#C4321F"/>
                    <circle cx="112" cy="222" r="16" fill="#C4321F"/>
                </g>

                <!-- Copo de refrigerante -->
                <path d="M548 164 L566 96 H592" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M486 180 H596 L582 352 H500 Z" fill="#FFF3E0"/>
                <path d="M490.200 232 H591.800 L586.900 292 H495.100 Z" fill="#FFD23F"/>
                <rect x="478" y="164" width="126" height="20" rx="8" fill="#fff"/>

                <!-- Hambúrguer -->
                <path d="M172 298 H468 C468 340 440 352 410 352 H230 C200 352 172 340 172 298 Z" fill="#E89A2E"/>
                <rect x="166" y="254" width="308" height="44" rx="22" fill="#5B2C16"/>
                <path d="M172 248 H468 Q475 248 475 254 Q475 260 468 260 H424 L398 286 L372 260 H172 Q165 260 165 254 Q165 248 172 248 Z" fill="#FFD23F"/>
                <rect x="172" y="232" width="296" height="18" rx="9" fill="#FF7A59"/>
                <path d="M156 206 H484 C492 206 490 226 476 226 C460 226 456 240 440 232 C424 224 412 242 396 232 C380 224 368 242 352 232 C336 224 324 242 308 232 C292 224 280 242 264 232 C248 224 236 242 220 232 C204 224 192 240 176 228 C160 226 148 206 156 206 Z" fill="#6DB33F"/>
                <path d="M170 210 C170 120 470 120 470 210 Z" fill="#F2A93B"/>
                <g fill="#FFF1D6">
                    <ellipse cx="250" cy="170" rx="11" ry="6" transform="rotate(-22 250 170)"/>
                    <ellipse cx="300" cy="152" rx="11" ry="6" transform="rotate(-8 300 152)"/>
                    <ellipse cx="352" cy="166" rx="11" ry="6" transform="rotate(10 352 166)"/>
                    <ellipse cx="400" cy="176" rx="11" ry="6" transform="rotate(24 400 176)"/>
                    <ellipse cx="302" cy="186" rx="11" ry="6"/>
                </g>
            </svg>
        </aside>

        <!-- Lado direito: login -->
        <main class="painel">
            <section class="conteudo" id="telaLogin">
                <h1>Que bom te ver!</h1>
                <p class="subtitulo">Entre com seu e-mail e senha para fazer seu pedido.</p>

                <form id="formLogin" novalidate>
                    <div class="alerta" id="erroGeral" role="alert" hidden></div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="nome@email.com" autocomplete="email" aria-describedby="erroEmail" required>
                        <p class="erro" id="erroEmail"></p>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-senha">
                            <input type="password" id="senha" name="senha" autocomplete="current-password" aria-describedby="erroSenha" required>
                            <button type="button" class="mostrar-senha" id="mostrarSenha" aria-label="Mostrar senha">Mostrar</button>
                        </div>
                        <p class="erro" id="erroSenha"></p>
                    </div>

                    <button type="submit" class="botao" id="botaoEntrar">
                        <span class="spinner" aria-hidden="true"></span>
                        <span id="textoBotao">Entrar</span>
                    </button>
                </form>
            </section>

            <!-- Aparece depois do login: prova de que a API devolveu o token -->
            <section class="conteudo" id="telaSucesso" hidden>
                <div class="selo" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <h1 id="tituloSucesso" tabindex="-1">Login feito!</h1>
                <p class="subtitulo">A API respondeu com o seu <strong>access_token</strong>:</p>
                <code class="token" id="saidaToken"></code>
                <p class="nota">Ele fica salvo nesta aba até você sair.</p>
                <button type="button" class="botao botao-secundario" id="botaoSair">Sair</button>
            </section>
        </main>

    </div>
</body>
</html>
